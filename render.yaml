# Render Deployment Configuration
# This file defines two separate services for Render

services:
  # Backend API Service (Python/FastAPI)
  - type: web
    name: chatbot-backend
    runtime: python
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: sh -c 'python -c "import backend.main; print(\"backend.main imported successfully\")" 2>&1; exec uvicorn backend.main:app --host 0.0.0.0 --port $PORT'
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./chatbot.db
      - key: CORS_ORIGINS
        value: https://chatbot-frontend.onrender.com
      - key: LOG_LEVEL
        value: INFO
    healthCheckPath: /health

  # Frontend Static Site (React)
  - type: static
    name: chatbot-frontend
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/build
    envVars:
      - key: REACT_APP_API_URL
        value: https://chatbot-backend.onrender.com
    headers:
      - key: Cache-Control
        value: public, max-age=0, must-revalidate
