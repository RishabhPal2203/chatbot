# Render Deployment Configuration
# This file defines two separate services for Render

services:
  # Backend API Service (Python/FastAPI)
  - type: web
    name: chatbot-backend
    runtime: python
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:////tmp/chatbot.db
      - key: CORS_ORIGINS
        value: "*"
      - key: LOG_LEVEL
        value: INFO
      # GROQ_API_KEY can be set as a secret in Render dashboard
      # - key: GROQ_API_KEY
      #   fromSecret: GROQ_API_KEY
    healthCheckPath: /health

  # Frontend Static Site (React)
  - type: static
    name: chatbot-frontend
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/build
    envVars:
      - key: REACT_APP_API_URL
        value: https://chatbot-backend.onrender.com
    headers:
      - key: Cache-Control
        value: public, max-age=0, must-revalidate
